<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">

		<title>警长出发！玩具找回行动</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="theme-color" content="#b1da89"><style>html,body{background:#b1da89!important;}#canvas{touch-action:none;}#status{background:#fff8e7!important;color:#315f62!important;}</style>
	<style>
#game-frame { position:fixed; inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); overflow:hidden; }
#canvas { width:100%; height:100%; touch-action:none; }

</style><link rel="manifest" href="manifest.webmanifest">

	<body>
		<main id="game-frame"><canvas id="canvas" aria-label="警长出发：点击左右按钮换道">
			这个浏览器暂时无法显示游戏，请换一个较新的浏览器。
		</canvas></main>

		<noscript>
			请开启 JavaScript 后再玩。
		</noscript>

		<div id="status"><p style="font:700 24px system-ui;margin:0 24px;text-align:center">警长出发！<br><small style="font-size:16px">游戏准备中…</small></p>
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>

		<aside id="pwa-bar" aria-label="添加游戏到桌面" hidden>
  <div id="pwa-invite">
    <img src="pwa-icon-192.png" width="40" height="40" alt="" />
    <div class="pwa-copy"><strong>把警长放到桌面</strong><span>下次点图标，就能出发</span></div>
    <button id="pwa-add" type="button">查看方法</button>
    <button id="pwa-dismiss" type="button" aria-label="不再提示安装" title="不再提示">×</button>
  </div>
  <button id="pwa-reopen" type="button" hidden>＋ 添加到桌面</button>
</aside>
<dialog id="pwa-help" aria-labelledby="pwa-help-title" aria-describedby="pwa-intro">
  <button id="pwa-close" class="pwa-close" type="button" aria-label="关闭安装说明">×</button>

  <button id="pwa-retry" type="button" hidden>重试保存离线文件</button>
  <p id="pwa-update" class="pwa-status" hidden>新版本已准备好。玩完后，关闭这个游戏的所有窗口，再打开即可更新。</p>
  <p class="pwa-small">首次保存约 46 MB。浏览器清理数据后需重新联网下载。不会自动安装，也不会请求通知权限。</p>
  <button id="pwa-done" type="button" class="pwa-primary">知道了，继续玩</button>
</dialog>

<script src="pwa.js"></script>
<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":6390732,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const frame = document.getElementById('game-frame');
const canvas = document.getElementById('canvas');
function resizeCanvas() {
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.round(frame.clientWidth * ratio));
  canvas.height = Math.max(1, Math.round(frame.clientHeight * ratio));
}
new ResizeObserver(resizeCanvas).observe(frame);
resizeCanvas();
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('游戏没有加载成功，请刷新后再试。');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = '这个浏览器暂时不能运行 Godot 游戏。请试试支持 WebGL 2 的新版浏览器。\n缺少：';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
            window.sheriffGameReady && window.sheriffGameReady();
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
